workflows:
  android-release:
    name: HTML Runner - Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - Keystore.jks
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APKs
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
