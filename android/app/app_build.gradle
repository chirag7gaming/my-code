plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.chirag.html_runner"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.chirag.html_runner"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "1.6.7"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

// Workaround for Flutter bug #174620:
// When using modern AGP DSL (pluginManagement in settings.gradle, no buildscript
// in build.gradle), Flutter's copy logic isn't triggered and the CLI can't find
// the APK. This task manually syncs it to the path Flutter expects.
def flutterOutDir = file("$buildDir/outputs/flutter-apk")
def apkReleaseDir = file("$buildDir/outputs/apk/release")
def cliOutDir     = new File(rootDir.parentFile, "build/app/outputs/flutter-apk")

tasks.register("syncFlutterApks", Copy) {
    from(flutterOutDir.exists() ? flutterOutDir : apkReleaseDir)
    into(cliOutDir)
    include "*.apk"
    doFirst { cliOutDir.mkdirs() }
}

android.applicationVariants.all { variant ->
    def cap = variant.name.capitalize()
    ["package${cap}", "assemble${cap}"].each { tname ->
        tasks.matching { it.name == tname }.all { t ->
            t.finalizedBy(tasks.named("syncFlutterApks"))
        }
    }
}

gradle.buildFinished {
    def src = flutterOutDir.exists() ? flutterOutDir : apkReleaseDir
    if (src.exists() && src.listFiles()?.any { it.name.endsWith(".apk") }) {
        cliOutDir.mkdirs()
        copy { from src; into cliOutDir; include "*.apk" }
    }
}
